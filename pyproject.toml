[project]
name = "data-agent"
version = "0.1.0"
description = "企业数据智能体平台 —— NL2SQL + 多专家协作 Agent(查数据 / 查资料 / 出报告)"
requires-python = ">=3.12"
# 依赖来源：合并 xiangm-NL2SQL/data-agent + deep_agent_demo + xiangm-DeepAgent 三方
dependencies = [
    # --- Web 层 ---
    "fastapi[standard]>=0.141.1",
    "uvicorn[standard]>=0.44.0",
    "python-multipart>=0.0.29",

    # --- 配置与日志 ---
    "omegaconf>=2.3.1",
    "pyyaml>=6.0.3",
    "python-dotenv>=1.2.2",
    "loguru>=0.7.3",
    "colorlog>=6.12.0",

    # --- Agent / LLM ---
    "langchain>=1.3.14",
    "langchain-deepseek>=1.1.0",
    "langchain-huggingface==1.2.1",
    "langchain-openai>=1.5.1",
    "langgraph>=1.2.10",
    "langgraph-checkpoint-redis>=0.5.1",
    "deepagents>=0.7.6",

    # --- 数据层 ---
    # 必须带 [asyncio]：否则不会装 greenlet，容器里 import sqlalchemy.ext.asyncio 直接报
    # "The SQLAlchemy asyncio module requires that the Python 'greenlet' library is installed"
    "sqlalchemy[asyncio]>=2.0.51",
    "asyncmy>=0.2.11",
    "mysql-connector-python>=9.7.0",
    "cryptography>=50.0.0",
    "elasticsearch[async]>=8,<9",
    "qdrant-client>=1.18.0",
    "redis>=7.4.1",
    "aiofiles>=25.1.0",

    # --- 检索 / 向量 ---
    "jieba>=0.42.1",
    "huggingface-hub>=1.26.0",

    # --- 外部服务与工具 ---
    "ragflow-sdk==0.24.0",
    "tavily-python>=0.7.27",
    "requests>=2.34.2",

    # --- 文档处理 / 报告 ---
    "python-docx>=1.2.0",
    "pypdf>=6.12.2",
    "openpyxl>=3.1.5",
    "pandas>=3.0.3",
    "markdown>=3.10.2",
    # pywin32 / win32com 只有 Windows 有，加平台标记：
    # 否则在 Linux 容器里 uv sync 会直接失败（装不上 pywin32）
    "pywin32>=311; sys_platform == 'win32'",

    # --- 图结构绘制(NL2SQL 流程可视化)---
    "grandalf>=0.8",
]
