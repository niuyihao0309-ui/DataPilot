# 前端静态站点配置（容器内 nginx）
server {
    listen       80;
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    # 单页应用：任何找不到的路径都回退到 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 静态资源缓存
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public";
    }
}
